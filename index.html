<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Renderlight — 숫자 없이 조명 잡기</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><circle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23f2b04a%22/></svg>" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <header>
    <div class="brand">Renderlight</div>
    <div class="actions">
      <label class="btn">모델 열기<input id="file" type="file" accept=".glb,.gltf" hidden /></label>
      <button class="btn" id="sample">샘플</button>
      <label class="toggle"><input id="studio" type="checkbox" checked /> 스튜디오 배경</label>
      <button class="btn primary" id="shot">PNG 저장</button>
    </div>
  </header>

  <main>
    <aside class="left">
      <div class="tabs" id="tabs"></div>
      <div class="presets" id="presets"></div>
    </aside>

    <section class="view">
      <canvas id="view"></canvas>
      <div class="drop" id="drop">GLB / glTF 파일을 여기에 놓으세요</div>
      <div class="hint" id="hint"></div>
    </section>

    <aside class="right">
      <div class="panel">
        <div class="panel-title">라이트 볼 <span class="sub">점을 끌어서 빛 방향 바꾸기</span></div>
        <canvas id="ball" width="260" height="260"></canvas>
        <div class="legend"><span><i class="dot"></i>앞쪽</span><span><i class="ring"></i>뒤쪽 (역광)</span><span>더블클릭: 앞↔뒤</span></div>
      </div>
      <div class="panel">
        <div class="panel-title">전체 밝기</div>
        <input id="exposure" type="range" min="-3" max="3" step="0.05" value="0" />
      </div>
      <div class="panel">
        <div class="panel-title">라이트</div>
        <div id="lights"></div>
      </div>
    </aside>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
