<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Renderlight</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><circle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23777%22/><circle cx=%2210%22 cy=%226%22 r=%222.5%22 fill=%22%23fff%22/></svg>" />
</head>
<body>
  <header class="bar">
    <span class="wordmark">Renderlight</span>
    <nav class="bar-actions">
      <label class="tbtn">모델 열기<input id="file" type="file" accept=".glb,.gltf" hidden /></label>
      <button class="tbtn" id="sample">샘플 모델</button>
    </nav>
    <div class="bar-right">
      <label class="exposure" title="화면 전체 밝기">노출
        <input id="exposure" type="range" min="-3" max="3" step="0.05" value="0" />
      </label>
      <label class="switch"><input id="studio" type="checkbox" checked /><span></span>배경</label>
      <button class="tbtn solid" id="shot">이미지 저장</button>
    </div>
  </header>

  <main class="app">
    <aside class="presets" id="presets" aria-label="조명 프리셋"></aside>

    <section class="view">
      <canvas id="view"></canvas>
      <div class="drop">놓으면 불러옵니다 (GLB, glTF)</div>
    </section>

    <aside class="inspector">
      <div class="ball-wrap">
        <canvas id="ball" width="440" height="440" aria-label="라이트 볼: 점을 끌어 빛 방향 바꾸기"></canvas>
        <p class="ball-help">점을 끌어 빛을 옮기세요. 테두리 밖으로 끌면 뒤에서 비추는 빛이 되고, 점선으로 표시돼요.</p>
      </div>
      <div class="lights" id="lights"></div>
    </aside>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
